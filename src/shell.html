<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="__FAVICON_DATA_URI__" />
<title>Esolangs Quiz — Name That Hello World</title>
<meta name="description" content="Name that Hello World: guess the esoteric programming language from its Hello, World! program. Normal, Hard, Expert, and Commands modes." />
<meta property="og:title" content="Esolangs Quiz — Name That Hello World" />
<meta property="og:description" content="Guess the esoteric programming language from its Hello, World! program. Normal, Hard, Expert, and Commands modes." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://bangyen.github.io/esolangs-quiz/" />
<meta property="og:image" content="https://bangyen.github.io/esolangs-quiz/assets/og-image.svg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Esolangs Quiz — Name That Hello World" />
<meta name="twitter:description" content="Guess the esoteric programming language from its Hello, World! program. Normal, Hard, Expert, and Commands modes." />
<meta name="twitter:image" content="https://bangyen.github.io/esolangs-quiz/assets/og-image.svg" />
<style>
__CSS__
</style>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <h1>Esolangs Quiz</h1>
    <div class="mode-toggle" role="group" aria-label="Quiz mode and study view">
      <button type="button" id="modeNormalBtn" class="active" aria-pressed="true">Normal</button>
      <button type="button" id="modeHardBtn" aria-pressed="false">Hard</button>
      <button type="button" id="modeExpertBtn" aria-pressed="false">Expert</button>
      <button type="button" id="modeCommandsBtn" aria-pressed="false">Commands</button>
      <button type="button" id="studyBtn" aria-pressed="false">Study</button>
    </div>
  </header>
  <p class="mode-note" id="modeNote"></p>

  <div id="quizView">
    <div class="status" aria-label="Quiz status">
      <span><b id="statQ">1 / 12</b></span>
      <span><span id="scoreLabel">Score</span> <b id="statScore">0</b></span>
      <span title="Questions answered correctly in a row">Streak <b id="statStreak">0</b></span>
      <span id="hintsStat">Hints <b id="statHints">0</b></span>
    </div>
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

    <div class="sr-only" id="srStatus" role="status"></div>
    <article class="card" id="card">
      <div class="card-meta"><span id="qTag"></span><span class="q-prompt" id="qTitle" tabindex="-1"></span></div>
      <noscript><p class="code-note">This quiz needs JavaScript to run.</p></noscript>
      <div class="code-wrap">
        <pre id="codeEl" aria-label="Hello World program"></pre>
        <img class="code-img" id="codeImg" src="__PIET_DATA_URI__" alt="A Piet program: a dense grid of coloured rectangles — red, yellow, blue, green, magenta and cyan blocks separated by black borders — that prints Hello, World!">
        <div class="code-note" id="codeNote"></div>
      </div>
      <div class="options" id="optionsEl" role="group" aria-label="Answer options"></div>
      <div class="feedback" id="feedbackEl" aria-live="polite"></div>
      <div class="hint-box" id="hintBox" role="status"></div>
      <div class="actions">
        <button class="btn-hint" id="hintBtn" type="button">Hint</button>
        <button class="btn-next" id="nextBtn" type="button">Next</button>
      </div>
    </article>
  </div>

  <div class="results" id="resultsView">
    <div class="final-score"><span id="finalScore">0</span><span class="denom" id="finalDenom"></span></div>
    <p class="final-sub"><span id="bdCorrect">0</span> correct · Best streak: <span id="bdBestStreak">0</span></p>
    <button class="btn-restart" id="restartBtn" type="button">Play again</button>
    <div class="review" id="reviewEl"></div>
  </div>

  <div class="study" id="studyView">
    <div class="study-head">
      <button class="btn-hint" id="studyBackBtn" type="button">Back to quiz</button>
      <p class="study-nav"><a href="#studyLanguages">Languages</a> · <a href="#studyCommands">Commands</a></p>
    </div>
    <h2 id="studyLanguages">Languages</h2>
    <div id="studyLangs"></div>
    <h2 id="studyCommands">Commands</h2>
    <div id="studyCmds"></div>
  </div>
</div>

<script>
__SCRIPT__
</script>
</body>
</html>
